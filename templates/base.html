{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Coleção Pokémon{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
<nav class="navbar navbar-dark bg-danger shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'cartaspokemon:inicio' %}">PokéColeção</a>
        <a class="btn btn-outline-light btn-sm" href="/admin/">Administração</a>
    </div>
</nav>
<main class="container py-5">
    {% block content %}{% endblock %}
</main>
</body>
</html>
